name: Enterprise Production CI Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: Code Quality (Oxlint), Type Integrity & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Oxlint Static Analysis & Test Gate
        run: pnpm run lint

      - name: Verify Backend TypeScript Integrity
        run: pnpm --filter adliyyah-fees-backend run build

      - name: Verify Frontend Strict Gating (tsc --noEmit & vite build)
        run: pnpm --filter adliyyah-fees-frontend run build

      - name: Run Enterprise Production Tests
        working-directory: ./backend
        run: pnpm run test:all
